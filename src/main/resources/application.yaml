application:
  title: ${APPLICATION_TITLE:OpenDataJungle Reference Data API}
  version: ${APPLICATION_VERSION:@project.version@}

spring:
  application:
    name: OpenDataJungle ReferenceData API

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/realms/master}
          audiences: ${JWT_AUDIENCES:account}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/open_data_jungle}
    username: ${DATABASE_USERNAME:user}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
    open-in-view: ${JPA_OPEN_IN_VIEW:false}

security:
  scopes:
    referencedata:
      read: ${SECURITY_SCOPE_REFERENCEDATA_READ:referencedata.read}
      write: ${SECURITY_SCOPE_REFERENCEDATA_WRITE:referencedata.write}
      delete: ${SECURITY_SCOPE_REFERENCEDATA_DELETE:referencedata.delete}
      admin: ${SECURITY_SCOPE_REFERENCEDATA_ADMIN:referencedata.admin}

server:
  port: ${SERVER_PORT:8083}
